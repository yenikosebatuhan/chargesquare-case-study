server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chargesquare}
    username: ${POSTGRES_USER:chargesquare}
    password: ${POSTGRES_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    table: flyway_history_wallet
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null

security:
  enabled: ${SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:local-dev-signing-key-please-change-me-32b}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.chargesquare: INFO
