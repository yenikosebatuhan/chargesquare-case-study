# One command to run the whole slice:  docker compose up --build
# Add the admin panel (Stage 2):        docker compose --profile panel up --build
#
# All configuration is read from .env (copy .env.example -> .env first).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chargesquare}
      POSTGRES_USER: ${POSTGRES_USER:-chargesquare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chargesquare} -d ${POSTGRES_DB:-chargesquare}"]
      interval: 5s
      timeout: 3s
      retries: 10

  station-service:
    build: ./station-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chargesquare}
      POSTGRES_USER: ${POSTGRES_USER:-chargesquare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      SECURITY_ENABLED: ${SECURITY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-local-dev-signing-key-please-change-me-32b}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  session-service:
    build: ./session-service
    depends_on:
      postgres:
        condition: service_healthy
      station-service:
        condition: service_started
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chargesquare}
      POSTGRES_USER: ${POSTGRES_USER:-chargesquare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      STATION_SERVICE_URL: http://station-service:8081
      SECURITY_ENABLED: ${SECURITY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-local-dev-signing-key-please-change-me-32b}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-120}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123}
      DEMO_VIEWER_USERNAME: ${DEMO_VIEWER_USERNAME:-viewer}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-viewer123}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Stage 2 admin panel. Enabled with the "panel" profile so the default
  # `docker compose up` stays focused on the Stage 1 backend slice.
  web:
    build:
      context: ./web
      args:
        VITE_SESSION_API: http://localhost:8082
        VITE_STATION_API: http://localhost:8081
    profiles: ["panel"]
    depends_on:
      - session-service
      - station-service
    ports:
      - "8080:80"

volumes:
  pgdata:
