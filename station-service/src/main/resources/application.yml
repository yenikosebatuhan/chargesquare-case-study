server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: station-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chargesquare}
    username: ${POSTGRES_USER:chargesquare}
    password: ${POSTGRES_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway; JPA only validates against it
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Own history table so both services can migrate the shared DB without clashing.
    table: flyway_history_station
    locations: classpath:db/migration
    # Shared DB: whichever service migrates second finds a non-empty schema but not its own
    # history table; baseline-on-migrate lets it proceed. baseline-version=0 keeps our own
    # V1 schema migration in scope (a version-1 baseline would skip it).
    baseline-on-migrate: true
    baseline-version: 0

# Stage 2 security. Set false for an open Stage-1-only backend.
security:
  enabled: ${SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:local-dev-signing-key-please-change-me-32b}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.chargesquare: INFO
