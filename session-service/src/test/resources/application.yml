# Test profile: in-memory H2, schema from JPA, no Flyway, security off so tests
# drive the domain flow directly. Station Service is mocked (@MockBean).
spring:
  datasource:
    url: jdbc:h2:mem:session;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null

station:
  service:
    url: http://localhost:0

security:
  enabled: false
  jwt:
    secret: test-signing-key-at-least-32-bytes-long!!
    expiry-minutes: 120

demo:
  users:
    admin:
      username: admin
      password: admin123
    viewer:
      username: viewer
      password: viewer123
