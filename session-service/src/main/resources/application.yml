server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: session-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chargesquare}
    username: ${POSTGRES_USER:chargesquare}
    password: ${POSTGRES_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    table: flyway_history_session
    locations: classpath:db/migration
    # Shared DB: the service that migrates second sees the other's tables. Its own history
    # table is still absent, so baseline-on-migrate lets it proceed. baseline-version=0 keeps
    # our own V1 schema migration in scope (a version-1 baseline would skip it).
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null   # omit null fields so start/stop bodies match the spec

# Real synchronous call target (Session Service -> Station Service).
station:
  service:
    url: ${STATION_SERVICE_URL:http://localhost:8081}

security:
  enabled: ${SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:local-dev-signing-key-please-change-me-32b}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:120}

# Seeded demo panel users (local dev only; overridden by env in real deployments).
demo:
  users:
    admin:
      username: ${DEMO_ADMIN_USERNAME:admin}
      password: ${DEMO_ADMIN_PASSWORD:admin123}
    viewer:
      username: ${DEMO_VIEWER_USERNAME:viewer}
      password: ${DEMO_VIEWER_PASSWORD:viewer123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.chargesquare: INFO
